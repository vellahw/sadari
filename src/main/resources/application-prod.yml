spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 운영 DB 장애 시 요청 스레드가 오래 묶이지 않도록 커넥션 획득 대기시간을 1분으로 제한함
      connection-timeout: ${DB_CONNECTION_TIMEOUT:60000}
      maximum-pool-size: ${DB_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${DB_MINIMUM_IDLE:2}
  application:
    name: sadari
  config:
    activate:
      on-profile: prod
  session:
    store-type: redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  messages:
    basename: messages
    encoding: UTF-8
  servlet:
    multipart:
      # 서비스의 이미지 바이트 검증 전에 과도한 업로드 본문이 서버 자원을 점유하지 못하도록 파일당 크기를 제한함
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      # 프로필과 배경 이미지를 한 요청에 각각 10MB까지 전송할 수 있도록 multipart 부가 데이터를 포함한 여유를 둠
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:21MB}

mybatis:
  mapper-locations: classpath:org/our/sadari/**/**/*.xml
  type-aliases-package: org.our.sadari.**.**.vo
  configuration:
    map-underscore-to-camel-case: true

domain:
  front: ${FRONT_DOMAIN}
  back: ${BACK_DOMAIN}

kakao:
  redirect:
    uri: /api/oauth/callback/kakao
  key:
    restApi: ${KAKAO_REST_API_KEY}
    javaScript: ${KAKAO_JAVASCRIPT_KEY}
    nativeApp: ${KAKAO_NATIVE_APP_KEY:}
  url:
    authorize: https://kauth.kakao.com/oauth/authorize
    token: https://kauth.kakao.com/oauth/token
    user-info: https://kapi.kakao.com/v2/user/me
    unlink: https://kapi.kakao.com/v1/user/unlink

# 카카오 도서 검색 API 주소는 공급자 계약 변경 시 코드 재빌드 없이 설정 파일에서 교체할 수 있게 관리함
book:
  search:
    url: https://dapi.kakao.com/v3/search/book
    # 캐시 적중 검색이 Redis와 서버를 과도하게 사용하지 않도록 차단하는 회원별 60초 요청 한도임
    cache-hit-rate-limit-per-minute: ${BOOK_SEARCH_CACHE_HIT_RATE_LIMIT_PER_MINUTE:300}
    # 캐시 미적중 검색의 외부 API 단기 호출을 차단하는 회원별 60초 요청 한도임
    cache-miss-rate-limit-per-minute: ${BOOK_SEARCH_CACHE_MISS_RATE_LIMIT_PER_MINUTE:60}
    # 캐시 미적중 시에만 차감하며 비활성화와 재로그인으로 초기화되지 않는 회원별 24시간 실제 호출 한도임
    rate-limit-per-day: ${BOOK_SEARCH_RATE_LIMIT_PER_DAY:200}
    # 공급자별 외부 API 쿼터를 보호하는 앱 전체 실제 호출 한도임
    provider-call-limit-per-day: ${BOOK_SEARCH_PROVIDER_CALL_LIMIT_PER_DAY:27000}
    # 사용자 식별값 없이 공급자와 검색어 해시 및 시작 위치로 공유하는 Redis 캐시 유효시간임
    cache-ttl-seconds: ${BOOK_SEARCH_CACHE_TTL_SECONDS:600}
    # 인기 검색어 합산과 회원별 중복 제한에 사용할 최근 기간임
    popular-keyword-window-days: ${BOOK_SEARCH_POPULAR_KEYWORD_WINDOW_DAYS:7}
    # 운영 순위 조작을 막기 위해 같은 회원의 같은 검색어는 집계 기간에 한 번만 반영함
    popular-keyword-user-dedup-enabled: true
    # 한 검색어를 공용 화면에 표시하기 위해 필요한 최소 고유 회원 수임
    popular-keyword-min-user-count: ${BOOK_SEARCH_POPULAR_KEYWORD_MIN_USER_COUNT:3}
    # 검색 화면의 세로 슬라이더에 전달할 인기 검색어 최대 건수임
    popular-keyword-max-size: ${BOOK_SEARCH_POPULAR_KEYWORD_MAX_SIZE:10}

google:
  translation:
    # Cloud Translation Basic v2 서버 호출 주소와 앱 전체 월간 무료 사용 보호 기준임
    url: https://translation.googleapis.com/language/translate/v2
    api-key: ${GOOGLE_TRANSLATION_API_KEY:}
    monthly-character-limit: 500000
    quota-zone: America/Los_Angeles
  books:
    # 영어 설정 회원의 도서 검색에 사용하는 Google Books Volumes API 주소임
    url: https://www.googleapis.com/books/v1/volumes
    api-key: ${GOOGLE_BOOKS_API_KEY:}

firebase:
  web:
    # 브라우저 Push 구독에 쓰는 VAPID public key임. public key지만 환경별 교체를 위해 환경변수로 관리함
    api-key: ${FIREBASE_WEB_API_KEY}
    auth-domain: ${FIREBASE_WEB_AUTH_DOMAIN}
    project-id: ${FIREBASE_WEB_PROJECT_ID}
    storage-bucket: ${FIREBASE_WEB_STORAGE_BUCKET}
    messaging-sender-id: ${FIREBASE_WEB_MESSAGING_SENDER_ID}
    app-id: ${FIREBASE_WEB_APP_ID}
    vapid-public-key: ${FIREBASE_VAPID_PUBLIC_KEY}
  admin:
    # FCM 서버 발송에 쓰는 service account json 경로임. json 원문은 Git이 아니라 EC2/Docker secret/환경별 파일로 관리함
    credentials-path: ${FIREBASE_CREDENTIALS_PATH}

jwt:
  secret_key: ${JWT_SECRET}
  access-token-validity-in-seconds: ${JWT_ACCESS_TOKEN_SECONDS:1800}
  refresh-token-validity-in-seconds: ${JWT_REFRESH_TOKEN_SECONDS:86400}
  refresh-rotation-grace-in-seconds: ${JWT_REFRESH_ROTATION_GRACE_SECONDS:10}

app:
  http:
    # 외부 API 장애 시 요청 스레드를 보호하고 운영 중에도 재빌드 없이 제한시간을 조정함
    connect-timeout-millis: ${HTTP_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${HTTP_READ_TIMEOUT_MILLIS:5000}
  storage:
    # S3를 사용하지 않는 Windows 실행 환경은 사용자·관리자 앱이 같은 공유 디렉터리를 사용함
    provider: ${STORAGE_PROVIDER:s3}
    local-root: ${STORAGE_LOCAL_ROOT:C:/shared/sadari-uploads}
    s3:
      bucket: ${STORAGE_S3_BUCKET}
      region: ${STORAGE_S3_REGION:ap-northeast-2}
      endpoint: ${STORAGE_S3_ENDPOINT:}
      path-style-access: ${STORAGE_S3_PATH_STYLE_ACCESS:false}
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
  upload:
    # 운영 환경에서도 파일 검증 기준을 환경변수로 조정하되 기본값은 로컬과 동일하게 유지함
    max-image-bytes: ${UPLOAD_MAX_IMAGE_BYTES:10485760}
    max-image-pixels: ${UPLOAD_MAX_IMAGE_PIXELS:20000000}
    max-image-dimension: ${UPLOAD_MAX_IMAGE_DIMENSION:8192}
  cookie:
    # HTTPS 운영 환경에서는 true가 맞음. 로컬 테스트용 prod 실행이 필요하면 환경변수로 false를 줄 수 있음
    secure: ${COOKIE_SECURE:true}
    # 프론트와 백엔드가 서로 다른 사이트면 None, 같은 사이트면 Lax를 사용함
    same-site: ${COOKIE_SAME_SITE:None}

# 운영 환경에서도 한 실행당 최대 100건을 넘길 수 없으며 시간대와 cron은 배포 환경변수로 조정할 수 있음
scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
  max-size: ${SCHEDULER_MAX_SIZE:100}
  round-completion-cron: "0 * * * * *"

# 독서 타이머는 서울 시간대 기준 하루 10분을 출석으로 인정하고 세션 상세를 1년 보존함
reading-timer:
  attendance-min-seconds: ${TIMER_ATTENDANCE_MIN_SECONDS:600}
  max-session-seconds: ${TIMER_MAX_SESSION_SECONDS:28800}
  zone-id: ${TIMER_ZONE_ID:Asia/Seoul}
  detail-retention-days: ${TIMER_DETAIL_RETENTION_DAYS:365}

# 운영 영구 탈퇴는 기본 30일 유예기간을 적용하고 로컬 전용 테스트 스케줄러는 항상 비활성화함
withdrawal:
  hard-delete-wait-days: ${WITHDRAWAL_HARD_DELETE_WAIT_DAYS:30}
  hard-delete-test-enabled: false

# 신고 자동 조치 임계치는 운영 정책상 대상별 5건으로 고정하며 환경변수로 변경하지 않음
complaint:
  result:
    max-size: ${COMPLAINT_RESULT_MAX_SIZE:5}
  auto-action:
    book-report-threshold: 5
    reply-threshold: 5
    profile-image-threshold: 5
    background-image-threshold: 5
    introduction-threshold: 5
  evidence:
    retention-days: 180
    cleanup-batch-size: 100
    cleanup-cron: "0 20 4 * * *"

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:info}
    org.our.sadari: ${LOGGING_LEVEL_APP:info}

# 마지막 화면 확인 후 채팅 열람 상태 유효 시간(초)
reading-club:
  chat-view-ttl-seconds: 15
